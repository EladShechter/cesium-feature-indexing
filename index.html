<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Cesium + Supercluster (Worker)</title>
    <style>
        html, body, #app, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; }
        #hud {
            position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.6);
            color: #fff; padding: 8px 10px; font: 13px/1.3 system-ui, sans-serif; border-radius: 8px;
        }
        #hud code { color: #a0e7ff; }
        /* Stacked below Cesium's top-right toolbar */
        #zoomControls {
            position: absolute; top: 50px; right: 10px; display: flex; flex-direction: column; gap: 4px;
        }
        #zoomControls button {
            width: 32px; height: 32px; border: 1px solid #444; border-radius: 6px; cursor: pointer;
            background: rgba(48,51,54,.85); color: #fff; font: 20px/1 system-ui, sans-serif;
        }
        #zoomControls button:hover { background: rgba(72,180,255,.85); }
    </style>
</head>
<body>
<div id="app">
    <div id="cesiumContainer"></div>
    <div id="hud">
        <div>Clusters: <code id="hudClusters">0</code></div>
        <div>Points (visible, unclustered): <code id="hudSingles">0</code></div>
        <div>Shapes (drawn): <code id="hudShapes">0</code></div>
        <div>Zoom level: <code id="hudZoom">0</code></div>
        <div>Click a bubble to list its members (first 20 shown in console)</div>
    </div>
    <div id="zoomControls">
        <button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button>
    </div>
</div>
<script type="module" src="src/main.ts"></script>
</body>
</html>
